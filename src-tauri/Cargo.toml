[package]
name = "keep-awake"
version = "0.1.0"
description = "KeepAwake - 跨平台防锁定工具"
authors = ["KeepAwake"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
